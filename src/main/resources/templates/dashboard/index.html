<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:replace="~{layout/main :: mainLayout}">
<title th:text="'学习中心 - 学习平台'"></title>

<main th:fragment="main-content">
    <!-- 欢迎标题 -->
    <div class="row mb-4">
        <div class="col">
            <h1 class="h3">
                欢迎回来, <span sec:authentication="name">用户</span>! 👋
            </h1>
            <p class="text-muted">继续您的学习之旅，查看进度和推荐内容</p>
        </div>
    </div>

    <!-- 统计卡片 -->
    <div class="row g-4 mb-4">
        <div class="col-md-3">
            <div class="card bg-primary text-white">
                <div class="card-body">
                    <div class="d-flex align-items-center">
                        <div class="flex-grow-1">
                            <h3 class="h2 mb-0" th:text="${totalCourses}">0</h3>
                            <p class="mb-0">已学课程</p>
                        </div>
                        <div class="ms-3">
                            <i class="bi bi-check-circle" style="font-size: 2.5rem; opacity: 0.8;"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card bg-success text-white">
                <div class="card-body">
                    <div class="d-flex align-items-center">
                        <div class="flex-grow-1">
                            <h3 class="h2 mb-0" th:text="${completedChapters}">0</h3>
                            <p class="mb-0">已完成章节</p>
                        </div>
                        <div class="ms-3">
                            <i class="bi bi-list-check" style="font-size: 2.5rem; opacity: 0.8;"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card bg-warning text-white">
                <div class="card-body">
                    <div class="d-flex align-items-center">
                        <div class="flex-grow-1">
                            <h3 class="h2 mb-0" th:text="${totalHours} + 'h'">0h</h3>
                            <p class="mb-0">学习时长</p>
                        </div>
                        <div class="ms-3">
                            <i class="bi bi-clock" style="font-size: 2.5rem; opacity: 0.8;"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card bg-info text-white">
                <div class="card-body">
                    <div class="d-flex align-items-center">
                        <div class="flex-grow-1">
                            <h3 class="h2 mb-0">0</h3>
                            <p class="mb-0">当前积分</p>
                        </div>
                        <div class="ms-3">
                            <i class="bi bi-trophy" style="font-size: 2.5rem; opacity: 0.8;"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 正在进行的学习 -->
    <div class="row g-4">
        <div class="col-lg-6">
            <div class="card h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h3 class="h5 mb-0">
                        <i class="bi bi-play-circle"></i> 正在学习
                    </h3>
                    <a href="/courses" class="btn btn-sm btn-primary">
                        <i class="bi bi-plus-circle"></i> 开始新课程
                    </a>
                </div>
                <div class="card-body">
                    <div th:if="${#lists.isEmpty(recommendedCourses)}">
                        <div class="alert alert-info">
                            <i class="bi bi-info-circle"></i> 您还没有正在学习的课程
                        </div>
                        <a href="/courses" class="btn btn-primary">
                            <i class="bi bi-collection"></i> 浏览课程
                        </a>
                    </div>

                    <div th:if="${!recommendedCourses.isEmpty()}" class="h-100 d-flex flex-column">
                        <div class="text-center text-muted">
                            <i class="bi bi-info-circle"></i> 请从推荐课程中选择一门开始学习
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card h-100">
                <div class="card-header">
                    <h3 class="h5 mb-0">
                        <i class="bi bi-star"></i> 推荐课程
                    </h3>
                </div>
                <div class="card-body">
                    <div th:if="${#lists.isEmpty(recommendedCourses)}">
                        <div class="alert alert-info">
                            <i class="bi bi-info-circle"></i> 根据您的学习历史，我们将推荐适合您的课程
                        </div>
                    </div>

                    <div th:if="${!#lists.isEmpty(recommendedCourses)}" class="vstack gap-3">
                        <div th:each="course : ${recommendedCourses}" class="card">
                            <div class="card-body">
                                <h6 class="card-title" th:text="${course.name}">推荐课程名</h6>
                                <p class="card-text text-muted small"
                                    th:text="${#strings.abbreviate(course.description, 80)}">课程描述</p>
                                <a th:href="@{/courses/{id}(id=${course.id})}" class="btn btn-sm btn-outline-primary">
                                    查看详情
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 最近学习记录 -->
    <div class="row g-4 mt-4">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h3 class="h5 mb-0">
                        <i class="bi bi-clock-history"></i> 最近学习记录
                    </h3>
                </div>
                <div class="card-body">
                    <div class="alert alert-info">
                        <i class="bi bi-info-circle"></i> 您的学习记录将显示在这里
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

</html>
