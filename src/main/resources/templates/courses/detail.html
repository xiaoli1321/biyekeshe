<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:replace="~{layout/main :: mainLayout}">
<title th:text="${course.name} + ' - 学习平台'"></title>

<main th:fragment="main-content">
    <!-- 返回按钮 -->
    <div class="mb-4">
        <a th:href="@{/courses}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> 返回课程列表
        </a>
    </div>

    <!-- 课程头部信息 -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row">
                <div class="col-md-8">
                    <h1 class="h2 mb-3" th:text="${course.name}">课程名称</h1>
                    <p class="lead text-muted" th:text="${course.description}">课程描述</p>

                    <div class="d-flex flex-wrap gap-3 mb-3">
                        <!-- 难度 -->
                        <span class="badge bg-primary fs-6" th:text="${course.difficultyLevel == 'BEGINNER'} ? '初级' :
                                           (${course.difficultyLevel == 'INTERMEDIATE'} ? '中级' : '高级')">难度</span>

                        <!-- 讲师 -->
                        <span th:if="${course.instructor}" class="badge bg-info fs-6">
                            <i class="bi bi-person"></i> <span th:text="${course.instructor}">讲师</span>
                        </span>

                        <!-- 时长 -->
                        <span th:if="${course.estimatedHours}" class="badge bg-secondary fs-6">
                            <i class="bi bi-clock"></i> <span th:text="${course.estimatedHours} + '小时'">时长</span>
                        </span>

                        <!-- 章节数 -->
                        <span class="badge bg-success fs-6" th:if="${chapters}">
                            <i class="bi bi-list-ul"></i> <span th:text="${chapters.size()} + '章节'">章节数</span>
                        </span>
                    </div>

                    <!-- 标签 -->
                    <div th:if="${course.tags}">
                        <span th:each="tag : ${#strings.arraySplit(course.tags, ',')}"
                            class="badge bg-light text-dark me-1" th:text="${#strings.trim(tag)}">标签</span>
                    </div>
                </div>

                <div class="col-md-4 text-center">
                    <!-- 课程封面占位 -->
                    <div class="bg-primary text-white d-flex align-items-center justify-content-center rounded"
                        style="height: 200px;">
                        <i class="bi bi-book" style="font-size: 4rem;"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 章节列表 -->
    <div class="card">
        <div class="card-header">
            <h3 class="h5 mb-0">
                <i class="bi bi-list-ul"></i> 课程章节
            </h3>
        </div>
        <div class="card-body">
            <div th:if="${chapters.empty}" class="alert alert-info">
                <i class="bi bi-info-circle"></i> 该课程暂无章节
            </div>

            <div class="accordion" id="chaptersAccordion" th:if="${chapters}">
                <div th:each="chapter, iterStat : ${chapters}" class="accordion-item">
                    <h2 class="accordion-header" th:id="'heading' + ${chapter.id}">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                            th:data-bs-target="'#collapse' + ${chapter.id}" aria-expanded="false"
                            th:aria-controls="'collapse' + ${chapter.id}">
                            <div class="d-flex align-items-center w-100">
                                <span class="badge bg-primary me-3" th:text="${iterStat.count}">1</span>
                                <div class="flex-grow-1">
                                    <strong th:text="${chapter.title}">章节标题</strong>
                                    <small class="d-block text-muted" th:if="${chapter.estimatedMinutes}">
                                        <i class="bi bi-clock"></i> 预估 <span
                                            th:text="${chapter.estimatedMinutes}">30</span> 分钟
                                    </small>
                                </div>
                                <span class="badge bg-light text-dark">
                                    <span th:text="${chapter.type == 'TEXT'} ? '文章' :
                                                (${chapter.type == 'VIDEO'} ? '视频' :
                                                (${chapter.type == 'QUIZ'} ? '测验' :
                                                (${chapter.type == 'EXERCISE'} ? '练习' : '项目')))">类型</span>
                                </span>
                            </div>
                        </button>
                    </h2>
                    <div th:id="'collapse' + ${chapter.id}" class="accordion-collapse collapse"
                        th:aria-labelledby="'heading' + ${chapter.id}" data-bs-parent="#chaptersAccordion">
                        <div class="accordion-body">
                            <div th:if="${chapter.content}" th:text="${chapter.content}" style="white-space: pre-line;">
                                章节内容
                            </div>
                            <div th:if="${!chapter.content}" class="text-muted">
                                <i class="bi bi-exclamation-circle"></i> 章节内容暂未添加
                            </div>

                            <div class="mt-3">
                                <a th:if="${chapter.content}" th:href="@{/chapters/{id}(id=${chapter.id})}"
                                    class="btn btn-sm btn-primary">
                                    <i class="bi bi-play-circle"></i> 开始学习
                                </a>
                                <a th:if="${!chapter.content}" href="#" class="btn btn-sm btn-outline-secondary"
                                    disabled>
                                    <i class="bi bi-x-circle"></i> 内容未准备
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

</html>
