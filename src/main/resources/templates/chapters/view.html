<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:replace="~{layout/main :: mainLayout}">
<title th:text="${chapter.title} + ' - 学习平台'"></title>

<main th:fragment="main-content">
    <!-- 面包屑导航 -->
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item">
                <a th:href="@{/courses}">课程</a>
            </li>
            <li class="breadcrumb-item">
                <a th:if="${chapter.course}" th:href="@{/courses/{id}(id=${chapter.course.id})}"
                    th:text="${chapter.course.name}">课程名称</a>
            </li>
            <li class="breadcrumb-item active" aria-current="page" th:text="${chapter.title}">章节标题</li>
        </ol>
    </nav>

    <!-- 章节内容 -->
    <div class="row">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h1 class="h4 mb-0" th:text="${chapter.title}">章节标题</h1>
                            <small class="text-muted" th:if="${chapter.estimatedMinutes}">
                                预计 <span th:text="${chapter.estimatedMinutes}">30</span> 分钟
                            </small>
                        </div>
                        <span class="badge bg-primary" th:text="${chapter.type == 'TEXT'} ? '文章' :
                                     (${chapter.type == 'VIDEO'} ? '视频' :
                                     (${chapter.type == 'QUIZ'} ? '测验' :
                                     (${chapter.type == 'EXERCISE'} ? '练习' : '项目')))">类型</span>
                    </div>
                </div>
                <div class="card-body">
                    <div th:if="${chapter.content}" th:text="${chapter.content}" style="white-space: pre-line;"
                        class="lead">
                        章节内容
                    </div>
                    <div th:if="${!chapter.content}" class="alert alert-info">
                        <i class="bi bi-info-circle"></i> 章节内容暂未添加，请联系管理员。
                    </div>

                    <!-- 学习笔记区域 -->
                    <div class="mt-4">
                        <h5 class="mb-3">
                            <i class="bi bi-journal-text"></i> 学习笔记
                        </h5>
                        <textarea id="studyNotes" class="form-control" rows="5" placeholder="在这里记录您的学习心得..."></textarea>
                        <div class="mt-2 text-end">
                            <button class="btn btn-sm btn-outline-primary" onclick="saveNotes()">
                                <i class="bi bi-save"></i> 保存笔记
                            </button>
                        </div>
                    </div>
                </div>
                <div class="card-footer">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <!-- 上一章 -->
                            <a th:if="${chapter.course}" th:href="@{/chapters/{id}(id=${prevChapter?.id})}"
                                th:disabled="${prevChapter == null}"
                                th:classappend="${prevChapter == null} ? 'disabled'"
                                class="btn btn-sm btn-outline-secondary">
                                <i class="bi bi-chevron-left"></i> 上一章
                            </a>
                        </div>
                        <div>
                            <!-- 完成章节 -->
                            <form th:if="${chapter.content}" th:action="@{/chapters/{id}/complete(id=${chapter.id})}"
                                method="post" class="d-inline">
                                <input type="hidden" name="userId" value="1">
                                <input type="hidden" name="courseId" th:value="${chapter.course.id}">
                                <input type="hidden" name="score" value="100">
                                <input type="hidden" name="minutes" value="30">
                                <button type="submit" class="btn btn-success">
                                    <i class="bi bi-check-circle"></i> 标记为已完成
                                </button>
                            </form>
                        </div>
                        <div>
                            <!-- 下一章 -->
                            <a th:if="${chapter.course}" th:href="@{/chapters/{id}(id=${nextChapter?.id})}"
                                th:disabled="${nextChapter == null}"
                                th:classappend="${nextChapter == null} ? 'disabled'"
                                class="btn btn-sm btn-outline-secondary">
                                下一章 <i class="bi bi-chevron-right"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 侧边栏 -->
        <div class="col-lg-4">
            <div class="card mb-4">
                <div class="card-header">
                    <h3 class="h6 mb-0">
                        <i class="bi bi-list-check"></i> 章节导航
                    </h3>
                </div>
                <div class="card-body">
                    <div class="alert alert-info small">
                        章节导航功能正在开发中...
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3 class="h6 mb-0">
                        <i class="bi bi-graph-up"></i> 学习进度
                    </h3>
                </div>
                <div class="card-body">
                    <div class="progress mb-3" style="height: 8px;">
                        <div class="progress-bar" role="progressbar" style="width: 0%"></div>
                    </div>
                    <p class="text-muted small mb-0">
                        您的学习进度将在这里显示
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
    // 保存笔记
    function saveNotes() {
        const notes = document.getElementById('studyNotes').value;
        // 实际应用中可以发送到服务器
        alert('笔记已保存到本地存储');
        localStorage.setItem('chapter_' + [[${ chapter.id }]] + '_notes', notes);
    }

    // 加载保存的笔记
    window.addEventListener('DOMContentLoaded', function () {
        const savedNotes = localStorage.getItem('chapter_' + [[${ chapter.id }]] + '_notes');
        if (savedNotes) {
            document.getElementById('studyNotes').value = savedNotes;
        }
    });
</script>

</html>
