# 服务器配置
server.port=8084

# MongoDB 配置
# spring.data.mongodb.uri=mongodb://root:root@localhost:27017/learning_platform?authSource=admin
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27018
spring.data.mongodb.database=learning_platform
spring.data.mongodb.username=root
spring.data.mongodb.password=root
spring.data.mongodb.authentication-database=admin

# Thymeleaf配置
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

# Security配置
spring.security.user.name=admin
spring.security.user.password=admin123

# 文件上传限制
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 日志配置
logging.level.com.learnplatform=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# MongoDB连接池配置
spring.data.mongodb.auto-index-creation=true

# JWT配置
app.jwt.secret=mySecretKeyForJWTTokenGenerationAndValidation12345mySecretKeyForJWTTokenGenerationAndValidation12345
app.jwt.expiration=86400000

# SpringDoc API文档配置
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html

# 应用配置
app.name=Learn Course Platform
app.version=1.0.0
app.description=基于知识图谱的编程学习平台 - 前后端分离版本

# Python 金融微服务配置（方案B：独立微服务）
python.service.base-url=${PYTHON_SERVICE_BASE_URL:http://localhost:8000}
python.service.username=${PYTHON_SERVICE_USERNAME:python_service}
python.service.password=${PYTHON_SERVICE_PASSWORD:python_service}
python.service.auto-register=${PYTHON_SERVICE_AUTO_REGISTER:true}
python.service.token-ttl=6d
python.service.token-refresh-skew=2h

# ===== LLM 工作流配置 =====
# Deepseek API Key (填入你的 key, 如: sk-xxxxxxxx)
llm.deepseek.api-key=sk-50f1cc3102c048fa85deb4cf55c950aa
# 若使用其他 OpenAI 兼容接口（如 one-api 中转），修改 base-url 即可
llm.deepseek.base-url=https://api.deepseek.com/v1
llm.deepseek.model=deepseek-chat
llm.deepseek.max-tokens=4096
llm.deepseek.temperature=0.7
# 单次 LLM 请求超时（秒）
llm.deepseek.timeout-seconds=120

# ===== Embedding 向量化配置 =====
# 如果使用 Ollama: http://localhost:11434/v1
# 如果使用 OpenAI: https://api.openai.com/v1
llm.embedding.base-url=https://router.tumuer.me/v1
llm.embedding.api-key=sk-FosSLV7Wp990Bu4juGMbcvEQmD2CV9Me7Ogj9xIS2kUkQ0bf
llm.embedding.model=Qwen/Qwen3-Embedding-4B
llm.embedding.timeout-seconds=60

